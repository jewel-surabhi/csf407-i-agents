# Top-level agent configuration.
# Environment variables (see .env.example) override matching keys.

llm:
  provider: groq
  model: openai/gpt-oss-20b   # open-weight, tool-calling; available on the Groq free tier
  temperature: 0.0
  max_tokens: 1024
  timeout_s: 30
  max_retries: 3

react:
  max_steps: 8
  cite_sources_required: true
  # Context guard (PROJECT_PLAN.md H.5). Once the serialized message log is
  # estimated above token_budget, only the most recent max_context_messages
  # are kept -- the system prompt always survives, and an assistant tool_calls
  # turn is never split from the tool results that answer it.
  token_budget: 6000
  max_context_messages: 8

paths:
  db: ./iagent.db
  seed_beliefs: ./data/seed/initial_beliefs.json
  seed_provenance: ./data/seed/initial_provenance.sql
  runs_dir: ./data/runs

logging:
  level: INFO
  json_traces: true

features:
  enable_actuators: false   # off by default so epistemic tests stay deterministic
