# Warehouse 7 — 5 aisles (A–E) × 4 cross-aisles (N / U / D / S) = 20 junctions.
#
# Still demo data, not part of the epistemic core. Every segment is seeded
# as ONE belief in the declarative layer so grounded confidence stays real:
#   state: clear   -> is_clear belief from `source` at `confidence`
#   state: blocked -> is_blocked belief (overrides any map claim)
#
# Shelves hang off aisles; each has one native SKU (and can accept
# transferred-in lots at runtime).

id: warehouse_7
start: A-S          # AGV-1 starts at the loading bay side
goal: WIDGET-42     # top-right pick face

# Junctions. Aisles A..E across (280..1000), cross-aisles N/U/D/S down (120..580).
junctions:
  A-N: {label: "Aisle A · North", x: 280, y: 120}
  B-N: {label: "Aisle B · North", x: 460, y: 120}
  C-N: {label: "Aisle C · North", x: 640, y: 120}
  D-N: {label: "Aisle D · North", x: 820, y: 120}
  E-N: {label: "Aisle E · North", x: 1000, y: 120}

  A-U: {label: "Aisle A · Upper", x: 280, y: 275}
  B-U: {label: "Aisle B · Upper", x: 460, y: 275}
  C-U: {label: "Aisle C · Upper", x: 640, y: 275}
  D-U: {label: "Aisle D · Upper", x: 820, y: 275}
  E-U: {label: "Aisle E · Upper", x: 1000, y: 275}

  A-D: {label: "Aisle A · Lower", x: 280, y: 430}
  B-D: {label: "Aisle B · Lower", x: 460, y: 430}
  C-D: {label: "Aisle C · Lower", x: 640, y: 430}
  D-D: {label: "Aisle D · Lower", x: 820, y: 430}
  E-D: {label: "Aisle E · Lower", x: 1000, y: 430}

  A-S: {label: "Aisle A · South", x: 280, y: 580}
  B-S: {label: "Aisle B · South", x: 460, y: 580}
  C-S: {label: "Aisle C · South", x: 640, y: 580}
  D-S: {label: "Aisle D · South", x: 820, y: 580}
  E-S: {label: "Aisle E · South", x: 1000, y: 580}

# Segments. Vertical runs within each aisle + horizontal cross-aisles at each row.
segments:
  # ─── vertical: Aisle A ───
  - {a: A-S, b: A-D, state: clear,   source: lidar_front,       confidence: 0.88}
  - {a: A-D, b: A-U, state: clear,   source: warehouse_scanner, confidence: 0.90}
  - {a: A-U, b: A-N, state: clear,   source: default_map,       confidence: 0.58}  # unverified
  # ─── vertical: Aisle B ───
  - {a: B-S, b: B-D, state: blocked, source: lidar_front,       confidence: 0.95}  # THE Scenario-A conflict
  - {a: B-D, b: B-U, state: clear,   source: default_map,       confidence: 0.60}
  - {a: B-U, b: B-N, state: clear,   source: default_map,       confidence: 0.55}
  # ─── vertical: Aisle C (central) ───
  - {a: C-S, b: C-D, state: clear,   source: lidar_front,       confidence: 0.94}
  - {a: C-D, b: C-U, state: clear,   source: warehouse_scanner, confidence: 0.92}
  - {a: C-U, b: C-N, state: clear,   source: warehouse_scanner, confidence: 0.95}
  # ─── vertical: Aisle D ───
  - {a: D-S, b: D-D, state: clear,   source: warehouse_scanner, confidence: 0.89}
  - {a: D-D, b: D-U, state: blocked, source: lidar_front,       confidence: 0.88}  # second conflict
  - {a: D-U, b: D-N, state: clear,   source: default_map,       confidence: 0.60}
  # ─── vertical: Aisle E ───
  - {a: E-S, b: E-D, state: clear,   source: warehouse_scanner, confidence: 0.91}
  - {a: E-D, b: E-U, state: clear,   source: lidar_front,       confidence: 0.90}
  - {a: E-U, b: E-N, state: clear,   source: warehouse_scanner, confidence: 0.93}

  # ─── horizontal: South cross-aisle ───
  - {a: A-S, b: B-S, state: clear,   source: warehouse_scanner, confidence: 0.93}
  - {a: B-S, b: C-S, state: clear,   source: warehouse_scanner, confidence: 0.90}
  - {a: C-S, b: D-S, state: clear,   source: warehouse_scanner, confidence: 0.91}
  - {a: D-S, b: E-S, state: clear,   source: warehouse_scanner, confidence: 0.88}
  # ─── horizontal: Lower cross-aisle ───
  - {a: A-D, b: B-D, state: clear,   source: warehouse_scanner, confidence: 0.85}
  - {a: B-D, b: C-D, state: clear,   source: warehouse_scanner, confidence: 0.82}
  - {a: C-D, b: D-D, state: clear,   source: default_map,       confidence: 0.60}  # unverified
  - {a: D-D, b: E-D, state: clear,   source: warehouse_scanner, confidence: 0.87}
  # ─── horizontal: Upper cross-aisle ───
  - {a: A-U, b: B-U, state: clear,   source: warehouse_scanner, confidence: 0.86}
  - {a: B-U, b: C-U, state: clear,   source: warehouse_scanner, confidence: 0.84}
  - {a: C-U, b: D-U, state: clear,   source: warehouse_scanner, confidence: 0.88}
  - {a: D-U, b: E-U, state: clear,   source: default_map,       confidence: 0.56}  # unverified
  # ─── horizontal: North cross-aisle ───
  - {a: A-N, b: B-N, state: clear,   source: default_map,       confidence: 0.55}
  - {a: B-N, b: C-N, state: clear,   source: warehouse_scanner, confidence: 0.90}
  - {a: C-N, b: D-N, state: clear,   source: warehouse_scanner, confidence: 0.92}
  - {a: D-N, b: E-N, state: clear,   source: warehouse_scanner, confidence: 0.89}

# Shelves hang beside aisle junctions. Each has one native SKU; bins can
# accept transferred-in lots at runtime.
shelves:
  - id: WIDGET-42
    near: E-N
    dx: 46
    dy: -6
    target: true
    stock:
      - {source: erp_system,        perspective: "third_party:erp",     predicate: count,   value: 50, note: "synced yesterday"}
      - {source: warehouse_scanner, perspective: self,                  predicate: count,   value: 48, note: "09:00 today"}
      - {source: sales_log,         perspective: "third_party:sales",   predicate: shipped, value: 3,  note: "shipped 12:15"}
  - id: BOLT-08
    near: A-U
    dx: -46
    dy: 0
    stock:
      - {source: warehouse_scanner, perspective: self, predicate: count, value: 118, note: "09:00 today"}
  - id: GEAR-30
    near: B-S
    dx: 46
