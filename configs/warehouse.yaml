      - {source: warehouse_scanner, perspective: self, predicate: count, value: 7, note: "09:00 today"}
  - id: SCREW-02
    near: A-D
    dx: 46
    dy: 0
    stock:
      - {source: warehouse_scanner, perspective: self, predicate: count, value: 212, note: "09:00 today"}
  - id: HINGE-21
    near: E-U
    dx: 46
    dy: 0
    stock:
      - {source: warehouse_scanner, perspective: self, predicate: count, value: 33, note: "09:00 today"}
