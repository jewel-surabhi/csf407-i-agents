[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iagent"
version = "0.1.0"
description = "I, Agent - Three-Layer Epistemic Architecture for Grounded Agents (CSF407)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "CSF407 I-Agent team" },
]
dependencies = [
    "networkx>=3.3",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "groq>=0.11",
    "rich>=13.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.10",
    "mypy>=1.11",
]

[project.scripts]
iagent = "iagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "live_llm: test requires a real LLM API key (set IAGENT_LIVE_LLM=1)",
    "epistemic: one of the 10 required epistemic evaluation tests",
]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
